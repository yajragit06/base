name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, migrate, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: cms
          POSTGRES_DB: cms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cms -d cms"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://cms:cms@localhost:5432/cms
      TEST_DATABASE_URL: postgres://cms:cms@localhost:5432/cms
      REDIS_URL: redis://localhost:6379
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Migrations run on an empty database first, as a fresh production deploy would.
      - run: pnpm db:migrate
      - name: Schema and migrations agree
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain packages/db/drizzle)" ]; then
            echo "Schema changed without a migration. Run pnpm db:generate and commit the result."
            exit 1
          fi
      - run: pnpm test
      - run: pnpm build
