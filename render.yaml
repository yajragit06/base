# Render Blueprint for a test deployment of the Base API and its database.
# The admin app (apps/admin) deploys to Vercel; see "Deploy for testing" in README.md.
# Secrets are declared with `sync: false`: Render asks for their values when the
# Blueprint is created. Plans and region are left to Render's defaults; pick them there.
databases:
  - name: base-db
    databaseName: base
    postgresMajorVersion: "16"

services:
  - type: web
    name: base-api
    runtime: node
    # --prod=false: the build needs dev tools (TypeScript, Turborepo, tsx for migrations)
    # even though NODE_ENV is production.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm turbo run build --filter=@cms/api...
    # Migrations are forward-only and safe to run on every start.
    startCommand: pnpm db:migrate && pnpm --filter @cms/api start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: base-db
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false
